# Experiment 4: + Auxiliary vessel decoder
# Tests whether vessel segmentation auxiliary task helps the backbone

experiment:
  name: exp4_vessel
  description: "EfficientNet-B0 + FPN + branches + vessel decoder auxiliary task"

model:
  backbone: efficientnet_b0
  pretrained: true
  use_fpn: true
  split_cbam: true
  use_vessel: true
  use_contrastive: false
  use_mc_dropout: false
  fpn_out_channels: 256
  dropout_rate: 0.3

training:
  batch_size: 32
  epochs: 50
  learning_rate: 1.0e-4
  weight_decay: 1.0e-2
  lambda_vessel: 0.5
