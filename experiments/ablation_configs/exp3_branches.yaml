# Experiment 3: + Split disease branches with CBAM
# Tests whether per-disease attention improves over shared head

experiment:
  name: exp3_branches
  description: "EfficientNet-B0 + FPN + split DR/HR branches with per-branch CBAM"

model:
  backbone: efficientnet_b0
  pretrained: true
  use_fpn: true
  split_cbam: true
  use_vessel: false
  use_contrastive: false
  use_mc_dropout: false
  fpn_out_channels: 256
  dropout_rate: 0.3

training:
  batch_size: 32
  epochs: 50
  learning_rate: 1.0e-4
  weight_decay: 1.0e-2
